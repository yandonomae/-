<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>茨木市 白地図</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha512-mwF7kG06e0fTprD+Gd7avmMpl+1NvKcJsteVEh9UpAJZciV06Pq4jG3E77s3UeJ8V+RaH59BIL2QYHkd0P/BxQ=="
      crossorigin=""
    />
    <style>
      :root {
        color-scheme: only light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
        color: #1a1a1a;
        font-family: "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      }

      #map {
        width: 100%;
        height: 100%;
        background: #ffffff;
      }

      .leaflet-container {
        background: #ffffff;
      }

      .station-label {
        font-size: 0.9rem;
        font-weight: 600;
        color: #1a1a1a;
        background: transparent;
        border: none;
        box-shadow: none;
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.95), 0 0 2px rgba(255, 255, 255, 0.95);
      }

      .station-label::before {
        display: none;
      }

      .leaflet-tooltip.station-label {
        margin-top: -10px;
      }

      .map-caption {
        position: absolute;
        bottom: 12px;
        left: 12px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 6px;
        border: 1px solid #d0d0d0;
        font-size: 0.8rem;
        line-height: 1.4;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }

      .legend-swatch {
        width: 18px;
        height: 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="map-caption">
      <div class="legend-item">
        <span class="legend-swatch" style="background: #0174bf"></span>
        <span>JR京都線</span>
      </div>
      <div class="legend-item">
        <span class="legend-swatch" style="background: #06a33a"></span>
        <span>大阪モノレール</span>
      </div>
      <div class="legend-item">
        <span class="legend-swatch" style="background: #004ca3"></span>
        <span>阪急京都線</span>
      </div>
    </div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA=="
      crossorigin=""
    ></script>
    <script>
      const GEOJSON_URL = "upload_files/N03-20250101_27.geojson";

      const lineColors = {
        "JR京都線": "#0174BF",
        "大阪モノレール": "#06A33A",
        "阪急京都線": "#004CA3",
      };

      const lineDefinitions = [
        {
          name: "JR京都線",
          color: lineColors["JR京都線"],
          stations: [
            { name: "千里丘", lat: 34.791328741602335, lng: 135.55127990361515 },
            { name: "茨木", lat: 34.815249424562744, lng: 135.56226505820496 },
            { name: "JR総持寺", lat: 34.828452660617046, lng: 135.57731654074456 },
            { name: "摂津富田", lat: 34.83761894561269, lng: 135.5933390866791 },
          ],
        },
        {
          name: "大阪モノレール彩都線",
          color: lineColors["大阪モノレール"],
          stations: [
            { name: "万博記念公園", lat: 34.806827314668936, lng: 135.53005040053708 },
            { name: "公園東口", lat: 34.81072577112878, lng: 135.53955497806987 },
            { name: "阪大病院前", lat: 34.81864488515618, lng: 135.52970517815763 },
            { name: "豊川", lat: 34.83464838942282, lng: 135.52677065227712 },
            { name: "彩都西", lat: 34.85521913877144, lng: 135.52278294673508 },
          ],
        },
        {
          name: "大阪モノレール本線",
          color: lineColors["大阪モノレール"],
          stations: [
            { name: "宇野辺", lat: 34.80804840265577, lng: 135.55459199078433 },
            { name: "南茨木", lat: 34.802421914271925, lng: 135.56516910151777 },
            { name: "沢良宣", lat: 34.79305532199678, lng: 135.56560290099247 },
            { name: "摂津", lat: 34.78003866337152, lng: 135.56141288159185 },
          ],
        },
        {
          name: "阪急京都線",
          color: lineColors["阪急京都線"],
          stations: [
            { name: "摂津市", lat: 34.786394237048235, lng: 135.5537682535518 },
            { name: "南茨木", lat: 34.80229324949706, lng: 135.56511755691452 },
            { name: "茨木市", lat: 34.81654492994446, lng: 135.57579925419532 },
            { name: "総持寺", lat: 34.827007881351975, lng: 135.5847208990953 },
            { name: "富田", lat: 34.83497876170166, lng: 135.59242871475357 },
          ],
        },
      ];

      const map = L.map("map", {
        zoomControl: true,
        attributionControl: false,
        minZoom: 11,
        maxZoom: 18,
        zoomSnap: 0.1,
        zoomDelta: 0.5,
      }).setView([34.82, 135.56], 12.5);

      const stationRegistry = new Map();

      const stationLabelOptions = {
        permanent: true,
        direction: "top",
        offset: [0, -8],
        className: "station-label",
      };

      lineDefinitions.forEach((lineDef) => {
        const polylineCoords = lineDef.stations.map((station) => [station.lat, station.lng]);
        L.polyline(polylineCoords, {
          color: lineDef.color,
          weight: 4,
          opacity: 0.95,
          lineCap: "round",
          lineJoin: "round",
        })
          .addTo(map)
          .bringToBack();

        lineDef.stations.forEach((station) => {
          if (!stationRegistry.has(station.name)) {
            const marker = L.circleMarker([station.lat, station.lng], {
              radius: 6,
              color: "#444444",
              weight: 2,
              fillColor: "#ffffff",
              fillOpacity: 1,
            })
              .addTo(map)
              .bindTooltip(station.name, stationLabelOptions);

            stationRegistry.set(station.name, {
              marker,
              latSum: station.lat,
              lngSum: station.lng,
              count: 1,
            });
          } else {
            const entry = stationRegistry.get(station.name);
            entry.latSum += station.lat;
            entry.lngSum += station.lng;
            entry.count += 1;
            const newLat = entry.latSum / entry.count;
            const newLng = entry.lngSum / entry.count;
            entry.marker.setLatLng([newLat, newLng]);
          }
        });
      });

      fetch(GEOJSON_URL)
        .then((response) => {
          if (!response.ok) {
            throw new Error(`市境データの読み込みに失敗しました (HTTP ${response.status}).`);
          }
          return response.json();
        })
        .then((geojson) => {
          const targetCityName = "茨木市";
          const filteredFeatures = (geojson?.features || []).filter(
            (feature) => feature?.properties?.N03_004 === targetCityName
          );

          if (filteredFeatures.length === 0) {
            throw new Error("GeoJSON内に茨木市の市境が見つかりませんでした。");
          }

          const filteredGeojson = {
            type: "FeatureCollection",
            features: filteredFeatures,
          };

          const boundaryLayer = L.geoJSON(filteredGeojson, {
            style: {
              color: "#101010",
              weight: 2,
              fillColor: "#ffffff",
              fillOpacity: 1,
            },
          }).addTo(map);

          map.fitBounds(boundaryLayer.getBounds(), { padding: [30, 30] });
          boundaryLayer.bringToFront();
        })
        .catch((error) => {
          console.error(error);
          alert("市境の読み込みに失敗しました。ブラウザのコンソールをご確認ください。");
        });
    </script>
  </body>
</html>
